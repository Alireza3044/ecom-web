{% extends "base.html" %}

{% block content %}
  <div class="p-4 flex space-x-8 border border-gray-200">
    <img class="sm:w-96 w-64 rounded-lg" src="{{ product.image_url }}" alt="{{ product.title }}">
    <div class="pt-8 space-y-2">
      <h3 class="font-bold sm:text-2xl text-xl">{{ product.title }}</h3>
      <p>{{ product.description }}</p>
      <p class="font-bold text-emerald-600 text-xl">${{ product.price }}</p>
      <button
        class="py-1 px-2 bg-yellow-400 rounded-lg cursor-pointer truncate"
        type="button"
        hx-post="{% url 'shop:cart-add' product.pk %}"
        hx-trigger="click"
        hx-swap="innerHTML"
        hx-target="#cart-count-badge"
      >Add to Cart</button>
    </div>
  </div>
{% endblock content %}
