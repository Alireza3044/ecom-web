<div class="w-inherit bg-gray-200 rounded-lg p-2">
  {% if not count %}
    <h2 class="text-2xl text-center text-black">The cart is empty</h2>
  {% else %}
    <h2 class="text-2xl text-center">
      <span class="text-black">{{ count }}</span>
      <span class="text-black">Items in Cart</span>
    </h2>
    <div class="max-h-50 overflow-y-auto my-4">
      {% for product in products %}
        <div class="flex w-full min-h-0 justify-between space-x-4">
          <p class="truncate text-black">{{ product.title }}</p>
          <p class="text-emerald-600">${{ product.price }}</p>
        </div>
      {% endfor %}
    </div>
    <div class="flex w-full justify-between space-x-4">
      <p class="font-bold text-black">Total</p>
      <p class="font-bold text-black text-emerald-600">${{ total|floatformat:2 }}</p>
    </div>
    <div class="w-full flex space-x-1">
      <a
        href="{% url "shop:checkout" %}"
        class="flex-2 text-white bg-blue-400 py-1 px-2 rounded-lg text-center">
        Checkout
      </a>
      <a
        href="{% url "shop:purchase-cancel" %}"
        class="flex-1 py-1 px-2 text-center text-white bg-red-500 rounded-lg cursor-pointer">
        Clear Cart
      </a>
    </div>
  {% endif %}
</div>
