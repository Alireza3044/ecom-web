{% load tailwind_cli %}
{% load django_htmx %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Plaza</title>
  <link rel="stylesheet" href="/static/css/index.css">
  {% tailwind_css %}
  {% htmx_script %}
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="font-[NotoSans]">
  <header>
    <nav class="flex items-center bg-blue-400 text-white p-2 space-x-8">
      <a href="{% url "shop:index" %}" class="font-bold text-2xl">Tech Plaza</a>
      <button class="cursor-pointer">
        <span>Cart(</span>
        <span id="cart-count" class="text-yellow-400 text-lg">{% block cart_count %}{% endblock cart_count %}</span>
        <span>)</span>
      </button>
    </nav>
  </header>
  {% block content %}{% endblock content %}
</body>
</html>
